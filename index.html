<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ペアプロ</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2 class="section-title">CAST</h2>
      <div class="story-wrap">
        <div class="story">
          <p class="story-number">第一話</p>
          <p class="story-title">「人も場所も全ては無くなる」</p>
          <p class="story-subtitle">町の食堂</p>
          <div class="cast-wrap">
            <div class="cast">
              <img class="cast-image" src="img/hulu_1.jpg" alt="キャスト1" />
              <p class="cast-name">夏帆</p>
              <span>（増田妃登美）</span>
              <span>食堂「ますだや」店主</span>
            </div>
            <div class="cast">
              <img class="cast-image" src="img/hulu_2.jpg" alt="キャスト2" />
              <p class="cast-name">斎藤工</p>
              <span>（水谷光生）</span>
              <span>高校教師</span>
            </div>
          </div>
          <a href="" class="btn">
            ストーリー
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
              <!-- Font Awesome Pro 5.15.4 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) -->
              <path
                d="M256 8c137 0 248 111 248 248S393 504 256 504 8 393 8 256 119 8 256 8zm113.9 231L234.4 103.5c-9.4-9.4-24.6-9.4-33.9 0l-17 17c-9.4 9.4-9.4 24.6 0 33.9L285.1 256 183.5 357.6c-9.4 9.4-9.4 24.6 0 33.9l17 17c9.4 9.4 24.6 9.4 33.9 0L369.9 273c9.4-9.4 9.4-24.6 0-34z"
              />
            </svg>
          </a>
        </div>
        <div class="story">
          <p class="story-number">第二話</p>
          <p class="story-title">「帰りたい場所が、ずっとなかった」</p>
          <p class="story-subtitle">大学学生寮</p>
          <div class="cast-wrap">
            <div class="cast">
              <img class="cast-image" src="img/hulu_3.jpg" alt="キャスト3" />
              <p class="cast-name">石井杏奈</p>
              <span>（高岡七海）</span>
              <span>農業大学3年生</span>
            </div>
            <div class="cast">
              <img class="cast-image" src="img/hulu_4.jpg" alt="キャスト4" />
              <p class="cast-name">萩原利久</p>
              <span>（八村陽平）</span>
              <span>大学3年生</span>
            </div>
            <div class="cast">
              <img class="cast-image" src="img/hulu_5.jpg" alt="キャスト5" />
              <p class="cast-name">長澤樹</p>
              <span>（筒井涼音）</span>
              <span>中学3年生</span>
            </div>
          </div>
          <a href="" class="btn">
            ストーリー
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
              <!-- Font Awesome Pro 5.15.4 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) -->
              <path
                d="M256 8c137 0 248 111 248 248S393 504 256 504 8 393 8 256 119 8 256 8zm113.9 231L234.4 103.5c-9.4-9.4-24.6-9.4-33.9 0l-17 17c-9.4 9.4-9.4 24.6 0 33.9L285.1 256 183.5 357.6c-9.4 9.4-9.4 24.6 0 33.9l17 17c9.4 9.4 24.6 9.4 33.9 0L369.9 273c9.4-9.4 9.4-24.6 0-34z"
              />
            </svg>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
